name: Claude review

# Reviews every PR with Claude and fails the `claude-review` check when a
# finding is critical. `main` requires this check (branch protection), so a
# critical finding blocks the merge until it is fixed and the PR is pushed again.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are skipped; marking one ready triggers the review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review
        id: review
        # Pinned to the commit of v1.0.289 (supply-chain hygiene: no moving tags).
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b
        with:
          # Pro/Max token from `claude setup-token`. To use an API key instead,
          # swap this for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs, security problems and
            violations of the rules in CLAUDE.md. Read the diff with
            `gh pr diff ${{ github.event.pull_request.number }}`, then read the changed
            files and the code they call. Only report problems introduced or made
            worse by this PR. Report a finding only if you can name concrete inputs
            or state that produce a wrong result; skip style nits.

            Severity, strictly:
            - critical: merging would lose or corrupt user data, compute a user's
              money wrong where they would act on it (balances, left-to-spend,
              imports that double or drop rows), expose another user's data or
              bypass auth, leak a secret, crash a core flow (sign-in, expenses,
              import, pay cycle), or ship a migration that fails or destroys data.
            - important: a real bug with limited reach or an easy workaround.
            - minor: an edge case or small quality problem.

            For each critical or important finding, post an inline comment on the
            exact line with mcp__github_inline_comment__create_inline_comment
            (pass confirmed: true). Start the comment with its severity in bold,
            then the problem, a concrete failure scenario and the fix.

            Return your result as the structured output: every finding with its
            severity, file, line and one-line summary, plus a short overall summary.
            Return an empty findings list if the PR is clean.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["critical","important","minor"]},"file":{"type":"string"},"line":{"type":"integer"},"summary":{"type":"string"}},"required":["severity","file","summary"]}}},"required":["summary","findings"]}'

      - name: Fail on critical findings
        if: always()
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          # Fail closed: no verdict (review crashed, timed out or was skipped)
          # blocks too, so nothing merges unreviewed by accident.
          if [ -z "$RESULT" ]; then
            echo "::error::The Claude review produced no verdict. Re-run the job once the cause is fixed."
            exit 1
          fi
          echo "$RESULT" | jq -r '"Summary: \(.summary)", (.findings[] | "- [\(.severity)] \(.file):\(.line // "?") \(.summary)")'
          critical=$(echo "$RESULT" | jq '[.findings[] | select(.severity == "critical")] | length')
          {
            echo "### Claude review"
            echo
            echo "$RESULT" | jq -r '.summary'
            echo
            echo "$RESULT" | jq -r '.findings[] | "- **\(.severity)** `\(.file):\(.line // "?")` \(.summary)"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$critical" -gt 0 ]; then
            echo "::error::$critical critical finding(s). Fix them and push to re-run the review."
            exit 1
          fi
